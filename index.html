  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">

  <title>Hair Stylist Portfolio</title>
  <style>
    body {
      font-family: 'Dancing Script', cursive;
      margin: 0;
      padding: 20px;
      background-color: #2E2E2E;
      color: #D4E0E0; 
      font-size: 18px;
    }

    h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 60px;
      text-align: center;
    }

    h2 {
      font-family: 'Parisienne', cursive;
      font-size: 48px;
      text-align: center;
    }

    .image-grid-5, .image-grid-3, .image-grid-2, .video-grid {
      display: grid;
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
    }

    .image-grid-5 {
      grid-template-columns: repeat(5, 1fr);
    }

    .image-grid-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .image-grid-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .image-grid-5 img, .image-grid-3 img, .image-grid-2 img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
    }

    .video-grid {
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      margin: 40px auto;
    }

    .video-grid video {
      width: 100%;
      height: auto;
      border-radius: 8px;
      object-fit: cover;
    }

    .top-nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 15px 30px;
      background-color: #2E2E2E;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .nav-right {
      display: flex;
      align-items: center;
    }

    .appointment-button {
  background-color: #B1462E;
  color: #ffffff;
  padding: 8px 16px;
  border-radius: 20px;
  font-weight: bold;
  margin-right: 20px;
  text-decoration: none;
  font-family: 'Open Sans', sans-serif; /* ← Add this line */
}

    .social-icon img {
      width: 24px;
      height: 24px;
    }

    @media (max-width: 768px) {
  .image-grid-5,
  .image-grid-3,
  .image-grid-2,
  .video-grid {
    grid-template-columns: 1fr; /* stack one item per row */
    gap: 16px;
    padding: 0 10px;
  }
}
  </style>
</head>
